site_name: Microbench
site_description: PyObject refcount vs C++ and Rust on the same loop
site_url: https://abhishekshree.github.io/microbench/
repo_url: https://github.com/abhishekshree/microbench
repo_name: abhishekshree/microbench

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js
  - javascripts/dashboard.js

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Results:
    - Reference passing: benchmarks/reference-passing.md
    - Allocation: benchmarks/allocation.md
    - Python variants: python-optimizations.md
  - Methodology: methodology.md
  - Reproduction: reproduction.md
